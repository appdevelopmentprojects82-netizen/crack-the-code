<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="face" cx="38%" cy="32%" r="75%">
      <stop offset="0" stop-color="#fff7c2"/>
      <stop offset=".28" stop-color="#ffd84a"/>
      <stop offset=".7" stop-color="#e0a218"/>
      <stop offset="1" stop-color="#9c6508"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0a0"/>
      <stop offset=".45" stop-color="#d79a14"/>
      <stop offset="1" stop-color="#6e4204"/>
    </linearGradient>
    <linearGradient id="inner" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#fff3b0"/>
      <stop offset=".5" stop-color="#c98a0e"/>
      <stop offset="1" stop-color="#7a4a05"/>
    </linearGradient>
    <linearGradient id="emb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffbe0"/>
      <stop offset="1" stop-color="#f0b72c"/>
    </linearGradient>
  </defs>
  <!-- thickness -->
  <circle cx="32" cy="34.5" r="29" fill="#7a4a05"/>
  <!-- rim with ridges -->
  <circle cx="32" cy="32" r="29" fill="url(#rim)"/>
  <circle cx="32" cy="32" r="27" fill="none" stroke="#8a5606" stroke-width="2.4" stroke-dasharray="1.2 2.1" opacity=".55"/>
  <!-- face -->
  <circle cx="32" cy="32" r="23.5" fill="url(#face)"/>
  <circle cx="32" cy="32" r="23.5" fill="none" stroke="url(#inner)" stroke-width="2"/>
  <circle cx="32" cy="32" r="19.5" fill="none" stroke="#a86d0a" stroke-width=".9" stroke-dasharray="2 2.4" opacity=".7"/>
  <!-- embossed star -->
  <path d="M32 17.5l4.3 8.9 9.8 1.3-7.2 6.8 1.8 9.7L32 39.5l-8.7 4.7 1.8-9.7-7.2-6.8 9.8-1.3z" fill="#8a5606" transform="translate(.9 1.2)" opacity=".75"/>
  <path d="M32 17.5l4.3 8.9 9.8 1.3-7.2 6.8 1.8 9.7L32 39.5l-8.7 4.7 1.8-9.7-7.2-6.8 9.8-1.3z" fill="url(#emb)" stroke="#b57708" stroke-width=".8"/>
  <!-- shine -->
  <path d="M14 24a20 20 0 0 1 14-12" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".75"/>
  <circle cx="44.5" cy="17" r="1.6" fill="#fff" opacity=".9"/>
